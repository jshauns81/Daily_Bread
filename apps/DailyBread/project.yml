# XcodeGen project definition. Run `xcodegen` in this folder to (re)generate
# DailyBread.xcodeproj — the .xcodeproj itself never gets committed.
name: DailyBread

options:
  bundleIdPrefix: com.jshauns
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  DailyBreadKit:
    path: Packages/DailyBreadKit

# Xcode Cloud only builds SHARED schemes, and xcodegen writes none unless asked —
# xcodebuild finds "DailyBread" locally only because it auto-creates schemes on
# the fly, which Cloud does not do. Declaring it here writes a real shared scheme
# into xcshareddata/xcschemes so Cloud can resolve the name in its workflow.
schemes:
  DailyBread:
    build:
      targets:
        DailyBread: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DailyBreadUITests
    archive:
      config: Release

targets:
  DailyBread:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      # The design system folder is reference material (HTML/JSX/tokens), not app
      # sources or bundle resources — never let it into the target.
      - path: DailyBread
        excludes:
          - "App/Daily Bread Design System"
          - "AppIcon.icon"
          # Shaun's in-progress Icon Composer pack lives untracked in his
          # checkout; without this exclude every regen sweeps it into the
          # target as a second icon document. Excluded until it replaces
          # AppIcon.icon deliberately.
          - "DB_iconpack.icon"
      # Shaun's Icon Composer icon (Liquid Glass). It shares the AppIcon name
      # with the asset-catalog set on purpose: OS 26+ renders this one, older
      # systems fall back to the classic set. A document package, so it must
      # be forced to file treatment or xcodegen would explode it into sources.
      - path: DailyBread/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: DailyBreadKit
      # The §1.2a widget family is iOS-only: the Mac's outside-the-app rainbow
      # is the live dock icon, not a widget.
      - target: DailyBreadWidgets
        destinationFilters: [iOS]
    # App group shared with the widget extension (WidgetBridge's snapshot file).
    # macOS gets no entitlements at all — see the sdk-conditional below.
    entitlements:
      path: Config/DailyBread.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.dailybread.shared
    info:
      path: DailyBread/Info.plist
      properties:
        CFBundleDisplayName: Daily Bread
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Mac App Store/TestFlight refuses archives without a category
        # (ITMS-90242, build 100). Family chore board = productivity.
        LSApplicationCategoryType: public.app-category.productivity
        # Dev convenience: allow http://localhost / LAN addresses while the
        # server runs without TLS in development. Public servers use HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # §3.1: the Themes folder (Documents/Themes) is user-visible in Files —
        # that's how a YAML theme gets onto an iPhone without a computer.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Support every orientation rather than requiring full screen — keeps the
        # iPad build eligible for multitasking/Stage Manager and clears the
        # "All interface orientations must be supported" warning. iPad = all four;
        # iPhone = portrait + both landscape (upside-down omitted, the usual set).
        "UISupportedInterfaceOrientations~iphone":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jshauns.dailybread
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 722W7866NQ
        CODE_SIGN_STYLE: Automatic
        # The app-group entitlement is for the iOS widget bridge; the (unsandboxed)
        # macOS app signs without entitlements, exactly as before.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ""

  # Simulator-only screen walker (UITests/ScreenWalkerTests.swift) — drives the
  # app over testmanagerd, which still delivers touches when synthetic mouse
  # events into the Simulator window get dropped.
  DailyBreadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: DailyBread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jshauns.dailybread.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 722W7866NQ
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: DailyBread

  DailyBreadWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    dependencies:
      - package: DailyBreadKit
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Daily Bread
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/DailyBreadWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.dailybread.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jshauns.dailybread.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 722W7866NQ
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
