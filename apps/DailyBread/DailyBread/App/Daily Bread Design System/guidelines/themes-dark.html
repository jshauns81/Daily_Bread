<!-- @dsCard group="Themes" viewport="700x230" name="Cozy darks" subtitle="Plum and deep evening — never black, never grey." -->
<!DOCTYPE html>
<html data-theme="mulberry"><head><meta charset="utf-8"><title>Cozy darks</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div style="display:flex;gap:12px">

<div style="flex:1">
 <div style="height:64px;border-radius:12px 12px 0 0;background:linear-gradient(to bottom,#3E1B30,#2A1220 60%);box-shadow:inset 0 0 0 .5px rgb(255 255 255 / .07)"></div>
 <div style="display:flex;height:28px">
  <div style="flex:1;background:#EA6E92"></div><div style="flex:1;background:#2E8C86"></div>
 </div>
 <div style="height:22px;background:#4A2237;border-radius:0 0 12px 12px;box-shadow:inset 0 0 0 .5px rgb(255 255 255 / .07)"></div>
 <div style="font-size:12px;font-weight:600;margin-top:8px">Mulberry</div>
 <div class="mono" style="font-size:9px;line-height:1.5">#3E1B30 → #2A1220<br>card #4A2237 · #EA6E92</div>
</div>
<div style="flex:1">
 <div style="height:64px;border-radius:12px 12px 0 0;background:linear-gradient(to bottom,#223049,#161E2C 60%);box-shadow:inset 0 0 0 .5px rgb(255 255 255 / .07)"></div>
 <div style="display:flex;height:28px">
  <div style="flex:1;background:#5B9BE0"></div><div style="flex:1;background:#4BA39C"></div>
 </div>
 <div style="height:22px;background:#2A3852;border-radius:0 0 12px 12px;box-shadow:inset 0 0 0 .5px rgb(255 255 255 / .07)"></div>
 <div style="font-size:12px;font-weight:600;margin-top:8px">Harbor</div>
 <div class="mono" style="font-size:9px;line-height:1.5">#223049 → #161E2C<br>card #2A3852 · #5B9BE0</div>
</div>
<div style="flex:2;font-size:12px;color:var(--ds-label-2);line-height:1.6;padding-left:8px">
Dark themes stop the background gradient at <b style="color:var(--ds-label)">y&nbsp;0.6</b> so the lower half settles into the deeper tone.<br><br>
Card stroke goes white&nbsp;@7%, card shadow black&nbsp;@25%, and every semantic colour lightens one step.
</div>
</div></body></html>
