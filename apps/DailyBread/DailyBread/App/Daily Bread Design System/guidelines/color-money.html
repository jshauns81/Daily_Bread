<!-- @dsCard group="Colors" viewport="700x180" name="Money is gold" subtitle="Every currency value in the app, in every place it appears." -->
<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><title>Money</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div class="card" style="display:flex;align-items:center;gap:26px;flex-wrap:wrap">
<div><div class="sec" style="letter-spacing:var(--ds-kerning-eyebrow)">Balance</div>
<div style="font-family:var(--ds-font-rounded);font-size:42px;font-weight:700;color:var(--ds-gold);line-height:1.05">$48.75</div></div>
<div style="display:flex;flex-direction:column;gap:7px;font-size:15px">
<span style="color:var(--ds-gold);font-weight:600">$2.00 <span style="color:var(--ds-label-2);font-weight:400">chore value</span></span>
<span style="color:var(--ds-gold);font-weight:800">+$4.25 <span style="color:var(--ds-label-2);font-weight:400">earned today</span></span>
<span style="color:var(--ds-gold);font-weight:600">$12.50 <span style="color:var(--ds-label-2);font-weight:400">this week</span></span>
</div>
<div style="display:flex;align-items:flex-end;gap:4px;height:70px">
<div style="width:12px;height:21px;border-radius:3px;background:var(--ds-gold)"></div><div style="width:12px;height:4px;border-radius:3px;background:var(--ds-gold)"></div><div style="width:12px;height:42px;border-radius:3px;background:var(--ds-gold)"></div><div style="width:12px;height:14px;border-radius:3px;background:var(--ds-gold)"></div><div style="width:12px;height:56px;border-radius:3px;background:var(--ds-gold)"></div><div style="width:12px;height:28px;border-radius:3px;background:var(--ds-gold)"></div><div style="width:12px;height:35px;border-radius:3px;background:var(--ds-gold)"></div><div style="width:12px;height:4px;border-radius:3px;background:var(--ds-gold)"></div><div style="width:12px;height:49px;border-radius:3px;background:var(--ds-gold)"></div><div style="width:12px;height:21px;border-radius:3px;background:var(--ds-gold)"></div><div style="width:12px;height:63px;border-radius:3px;background:var(--ds-gold)"></div><div style="width:12px;height:14px;border-radius:3px;background:var(--ds-gold)"></div><div style="width:12px;height:42px;border-radius:3px;background:var(--ds-gold)"></div><div style="width:12px;height:28px;border-radius:3px;background:var(--ds-gold)"></div>
</div>
<div style="padding:8px 14px;border-radius:999px;background:var(--ds-gold);color:rgb(0 0 0 / .8);font-size:13px;font-weight:700">✓ Approve</div>
</div>
<div class="sec" style="margin-top:12px">Gold never means anything else. Legendary rarity also using gold is the one documented overload.</div>
</body></html>
