<!-- @dsCard group="Spacing" viewport="700x200" name="Radii" subtitle="Every rounded rect is style: .continuous — a squircle, not a circular arc." -->
<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><title>Radius</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div class="row" style="gap:12px">

<div style="text-align:center"><div style="width:56px;height:56px;background:var(--ds-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);border-radius:24px"></div><div class="mono" style="font-size:9px;margin-top:6px">24px</div><div style="font-size:9px;color:var(--ds-label-2)">hero</div></div>
<div style="text-align:center"><div style="width:56px;height:56px;background:var(--ds-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);border-radius:20px"></div><div class="mono" style="font-size:9px;margin-top:6px">20px</div><div style="font-size:9px;color:var(--ds-label-2)">card</div></div>
<div style="text-align:center"><div style="width:56px;height:56px;background:var(--ds-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);border-radius:12px"></div><div class="mono" style="font-size:9px;margin-top:6px">12px</div><div style="font-size:9px;color:var(--ds-label-2)">swatch / tile</div></div>
<div style="text-align:center"><div style="width:56px;height:56px;background:var(--ds-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);border-radius:10px"></div><div class="mono" style="font-size:9px;margin-top:6px">10px</div><div style="font-size:9px;color:var(--ds-label-2)">field</div></div>
<div style="text-align:center"><div style="width:56px;height:56px;background:var(--ds-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);border-radius:7px"></div><div class="mono" style="font-size:9px;margin-top:6px">7px</div><div style="font-size:9px;color:var(--ds-label-2)">grid cell</div></div>
<div style="text-align:center"><div style="width:56px;height:56px;background:var(--ds-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);border-radius:2.5px"></div><div class="mono" style="font-size:9px;margin-top:6px">2.5px</div><div style="font-size:9px;color:var(--ds-label-2)">heatmap day</div></div>
<div style="text-align:center"><div style="width:56px;height:56px;background:var(--ds-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);border-radius:999px"></div><div class="mono" style="font-size:9px;margin-top:6px">capsule</div><div style="font-size:9px;color:var(--ds-label-2)">capsule</div></div>
</div>
<div class="sec" style="margin-top:16px;letter-spacing:0">CSS can only approximate a squircle. Use a generous plain radius; never fake a superellipse.</div>
</body></html>
