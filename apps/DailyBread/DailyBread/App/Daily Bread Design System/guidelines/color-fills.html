<!-- @dsCard group="Colors" viewport="700x200" name="Fill steps" subtitle="SwiftUI .quaternary — icon tiles, field backgrounds, tracks, unselected pills." -->
<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><title>Fills</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div class="row" style="gap:14px">
<div style="text-align:center"><div style="width:40px;height:40px;border-radius:var(--ds-radius-field);background:var(--ds-fill);display:grid;place-items:center;font-size:20px;font-family:var(--ds-font-emoji)">🧺</div><div class="mono" style="font-size:9px;margin-top:5px">icon tile 40</div></div>
<div style="text-align:center"><div style="width:46px;height:46px;border-radius:var(--ds-radius-icon-tile);background:var(--ds-fill);display:grid;place-items:center;font-size:22px;font-family:var(--ds-font-emoji)">🗑</div><div class="mono" style="font-size:9px;margin-top:5px">Next Up 46</div></div>
<div style="text-align:center"><div style="width:36px;height:36px;border-radius:50%;background:var(--ds-fill-strong);display:grid;place-items:center;font-size:14px;font-weight:600">S</div><div class="mono" style="font-size:9px;margin-top:5px">day pill off</div></div>
<div style="text-align:center"><div style="width:36px;height:36px;border-radius:50%;background:var(--ds-accent);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600">M</div><div class="mono" style="font-size:9px;margin-top:5px">day pill on</div></div>
<div style="text-align:center"><div style="width:32px;height:32px;border-radius:var(--ds-radius-day-cell);background:var(--ds-fill-strong)"></div><div class="mono" style="font-size:9px;margin-top:5px">grid cell off</div></div>
<div style="text-align:center"><div style="width:32px;height:32px;border-radius:var(--ds-radius-day-cell);background:var(--ds-accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700">✓</div><div class="mono" style="font-size:9px;margin-top:5px">grid cell on</div></div>
<div style="flex:1;min-width:150px"><div style="padding:10px 12px;border-radius:var(--ds-radius-field);background:var(--ds-fill-soft);font-size:15px;color:var(--ds-label-2)">What's the chore?</div><div class="mono" style="font-size:9px;margin-top:5px">inline field · fill-soft</div></div>
</div>
<div style="margin-top:14px;display:flex;gap:16px" class="mono">
<span>--ds-fill 10%</span><span>--ds-fill-soft 5%</span><span>--ds-fill-strong 14%</span><span>--ds-hairline 8%</span>
</div></body></html>
