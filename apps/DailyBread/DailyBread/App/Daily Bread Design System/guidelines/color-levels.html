<!-- @dsCard group="Colors" viewport="700x175" name="Level tiers" subtitle="Fixed hues — a level's colour is its identity, so it does not follow the theme." -->
<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><title>Levels</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div style="display:flex;gap:10px">

<div style="flex:1;text-align:center">
 <div style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,#8A8F98,color-mix(in srgb,#8A8F98 65%,transparent));box-shadow:0 5px 20px color-mix(in srgb,#8A8F98 50%,transparent)">
  <span style="font-size:18px;font-family:var(--ds-font-emoji)">🌱</span>
  <span style="font-size:11px;font-weight:700;color:#fff">LVL 0</span></div>
 <div style="font-size:9px;font-weight:700;letter-spacing:1.6px;margin-top:7px;color:#8A8F98">STARTER</div>
 <div class="mono" style="font-size:9px">#8A8F98</div>
</div>
<div style="flex:1;text-align:center">
 <div style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,#6BA368,color-mix(in srgb,#6BA368 65%,transparent));box-shadow:0 5px 20px color-mix(in srgb,#6BA368 50%,transparent)">
  <span style="font-size:18px;font-family:var(--ds-font-emoji)">⭐</span>
  <span style="font-size:11px;font-weight:700;color:#fff">LVL 1</span></div>
 <div style="font-size:9px;font-weight:700;letter-spacing:1.6px;margin-top:7px;color:#6BA368">COMMON</div>
 <div class="mono" style="font-size:9px">#6BA368</div>
</div>
<div style="flex:1;text-align:center">
 <div style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,#4DA8C6,color-mix(in srgb,#4DA8C6 65%,transparent));box-shadow:0 5px 20px color-mix(in srgb,#4DA8C6 50%,transparent)">
  <span style="font-size:18px;font-family:var(--ds-font-emoji)">⚡</span>
  <span style="font-size:11px;font-weight:700;color:#fff">LVL 2</span></div>
 <div style="font-size:9px;font-weight:700;letter-spacing:1.6px;margin-top:7px;color:#4DA8C6">UNCOMMON</div>
 <div class="mono" style="font-size:9px">#4DA8C6</div>
</div>
<div style="flex:1;text-align:center">
 <div style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,#E8894A,color-mix(in srgb,#E8894A 65%,transparent));box-shadow:0 5px 20px color-mix(in srgb,#E8894A 50%,transparent)">
  <span style="font-size:18px;font-family:var(--ds-font-emoji)">🔥</span>
  <span style="font-size:11px;font-weight:700;color:#fff">LVL 3</span></div>
 <div style="font-size:9px;font-weight:700;letter-spacing:1.6px;margin-top:7px;color:#E8894A">RARE</div>
 <div class="mono" style="font-size:9px">#E8894A</div>
</div>
<div style="flex:1;text-align:center">
 <div style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,#9B7BE0,color-mix(in srgb,#9B7BE0 65%,transparent));box-shadow:0 5px 20px color-mix(in srgb,#9B7BE0 50%,transparent)">
  <span style="font-size:18px;font-family:var(--ds-font-emoji)">💎</span>
  <span style="font-size:11px;font-weight:700;color:#fff">LVL 4</span></div>
 <div style="font-size:9px;font-weight:700;letter-spacing:1.6px;margin-top:7px;color:#9B7BE0">EPIC</div>
 <div class="mono" style="font-size:9px">#9B7BE0</div>
</div>
<div style="flex:1;text-align:center">
 <div style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,#E0A93F,color-mix(in srgb,#E0A93F 65%,transparent));box-shadow:0 5px 20px color-mix(in srgb,#E0A93F 50%,transparent)">
  <span style="font-size:18px;font-family:var(--ds-font-emoji)">👑</span>
  <span style="font-size:11px;font-weight:700;color:#fff">LVL 5</span></div>
 <div style="font-size:9px;font-weight:700;letter-spacing:1.6px;margin-top:7px;color:#E0A93F">LEGENDARY</div>
 <div class="mono" style="font-size:9px">#E0A93F</div>
</div>
</div>
<div class="sec" style="margin-top:14px">% of today's chores done → 1/25/50/75/100. The badge glows in its own tier colour at 50%.</div>
</body></html>
