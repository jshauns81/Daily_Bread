<!-- @dsCard group="Type" viewport="700x210" name="Section headers" subtitle="The only uppercase treatment: caption/bold/.secondary with real kerning." -->
<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><title>Sections</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div style="display:flex;flex-direction:column;gap:14px">

<div><div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--ds-label-2)">SCREEN TIME THIS WEEK</div>
<div class="mono" style="margin-top:4px">section header · kerning 0.8</div></div>
<div><div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ds-label-2)">NEXT UP</div>
<div class="mono" style="margin-top:4px">eyebrow · kerning 1.0</div></div>
<div><div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;color:var(--ds-label-2)">LEGENDARY</div>
<div class="mono" style="margin-top:4px">level tier word · kerning 1.6</div></div>
</div>
<div class="sec" style="margin-top:16px;letter-spacing:0">Others in use: AT RISK TODAY · TODAY’S PROGRESS · BALANCE · LAST 14 DAYS · BADGES · LATEST · GOAL · HELP RAISED</div>
</body></html>
