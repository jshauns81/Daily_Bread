<!-- @dsCard group="Spacing" viewport="700x230" name="Elevation" subtitle="One card shadow. One level glow. One Blessing wash. Nothing else." -->
<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div style="display:flex;gap:14px;align-items:center">
<div class="card" style="flex:1"><div class="sec">card</div><div class="mono" style="margin-top:8px;line-height:1.6">shadow(radius: 10, y: 3)<br>black@7% light · @25% dark<br>+ 0.5px stroke</div></div>
<div style="flex:1;text-align:center">
 <div style="display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,#E0A93F,#e0a93fa6);box-shadow:0 5px 32px #e0a93f80">
  <span style="font-size:20px;font-family:var(--ds-font-emoji)">👑</span><span style="font-size:13px;font-weight:800;color:#fff">LVL 5</span></div>
 <div class="mono" style="margin-top:8px">shadow(tier@50%, radius: 16, y: 5)</div></div>
<div style="flex:1">
 <div style="border-radius:12px;padding:11px 13px;background:color-mix(in srgb,var(--ds-glow) 18%,transparent);display:flex;justify-content:space-between;align-items:center">
  <span style="font-size:15px;font-weight:500">Dishes</span><span style="font-size:12px;font-weight:700;color:var(--ds-gold)">✓ Approved</span></div>
 <div class="mono" style="margin-top:8px;line-height:1.6">the Blessing: glow@18% row wash<br>0.9s, easeOut(0.4), then it leaves</div></div>
</div>
<div class="sec" style="margin-top:16px;letter-spacing:0">Cards do not lift on hover. This is a touch-first app.</div>
</body></html>
