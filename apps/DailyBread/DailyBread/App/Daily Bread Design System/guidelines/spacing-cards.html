<!-- @dsCard group="Spacing" viewport="700x210" name="Card paddings" subtitle="Four values, each with a job. glassCard() defaults to 14." -->
<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><title>Card paddings</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div style="display:flex;gap:12px;align-items:flex-start">

<div style="flex:1">
 <div style="background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:12px">
  <div style="background:color-mix(in srgb,var(--ds-accent) 14%,transparent);border-radius:8px;height:44px"></div></div>
 <div style="font-size:12px;font-weight:600;margin-top:8px">12px · tile</div>
 <div style="font-size:10px;color:var(--ds-label-2);line-height:1.45">stat tiles, badges, child tiles</div>
</div>
<div style="flex:1">
 <div style="background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:14px">
  <div style="background:color-mix(in srgb,var(--ds-accent) 14%,transparent);border-radius:8px;height:44px"></div></div>
 <div style="font-size:12px;font-weight:600;margin-top:8px">14px · default</div>
 <div style="font-size:10px;color:var(--ds-label-2);line-height:1.45">every ordinary card</div>
</div>
<div style="flex:1">
 <div style="background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:16px">
  <div style="background:color-mix(in srgb,var(--ds-accent) 14%,transparent);border-radius:8px;height:44px"></div></div>
 <div style="font-size:12px;font-weight:600;margin-top:8px">16px · greeting</div>
 <div style="font-size:10px;color:var(--ds-label-2);line-height:1.45">the parent greeting card</div>
</div>
<div style="flex:1">
 <div style="background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:18px">
  <div style="background:color-mix(in srgb,var(--ds-accent) 14%,transparent);border-radius:8px;height:44px"></div></div>
 <div style="font-size:12px;font-weight:600;margin-top:8px">18px · hero</div>
 <div style="font-size:10px;color:var(--ds-label-2);line-height:1.45">the balance hero</div>
</div>
</div></body></html>
