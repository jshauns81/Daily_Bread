<!-- @dsCard group="Themes" viewport="700x230" name="Warm lights" subtitle="Warm white into a tinted cream. Cards are pure white." -->
<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><title>Warm lights</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div style="display:flex;gap:12px">

<div style="flex:1">
 <div style="height:64px;border-radius:12px 12px 0 0;background:linear-gradient(to bottom,#FFFDF9,#FBF1E2);box-shadow:inset 0 0 0 .5px rgb(0 0 0 / .06)"></div>
 <div style="display:flex;height:28px">
  <div style="flex:1;background:#C7284F"></div><div style="flex:1;background:#2E8C86"></div>
 </div>
 <div style="height:22px;background:#FFFFFF;border-radius:0 0 12px 12px;box-shadow:inset 0 0 0 .5px rgb(0 0 0 / .06)"></div>
 <div style="font-size:12px;font-weight:600;margin-top:8px">Sunroom</div>
 <div class="mono" style="font-size:9px;line-height:1.5">#FFFDF9 → #FBF1E2<br>#C7284F · #2E8C86</div>
</div>
<div style="flex:1">
 <div style="height:64px;border-radius:12px 12px 0 0;background:linear-gradient(to bottom,#FBFCFF,#EAF1FE);box-shadow:inset 0 0 0 .5px rgb(0 0 0 / .06)"></div>
 <div style="display:flex;height:28px">
  <div style="flex:1;background:#3D7BE0"></div><div style="flex:1;background:#4BA39C"></div>
 </div>
 <div style="height:22px;background:#FFFFFF;border-radius:0 0 12px 12px;box-shadow:inset 0 0 0 .5px rgb(0 0 0 / .06)"></div>
 <div style="font-size:12px;font-weight:600;margin-top:8px">Sky</div>
 <div class="mono" style="font-size:9px;line-height:1.5">#FBFCFF → #EAF1FE<br>#3D7BE0 · #4BA39C</div>
</div>
<div style="flex:1">
 <div style="height:64px;border-radius:12px 12px 0 0;background:linear-gradient(to bottom,#FFF9FB,#FBEAF1);box-shadow:inset 0 0 0 .5px rgb(0 0 0 / .06)"></div>
 <div style="display:flex;height:28px">
  <div style="flex:1;background:#D24E86"></div><div style="flex:1;background:#6BA3C6"></div>
 </div>
 <div style="height:22px;background:#FFFFFF;border-radius:0 0 12px 12px;box-shadow:inset 0 0 0 .5px rgb(0 0 0 / .06)"></div>
 <div style="font-size:12px;font-weight:600;margin-top:8px">Rosewater</div>
 <div class="mono" style="font-size:9px;line-height:1.5">#FFF9FB → #FBEAF1<br>#D24E86 · #6BA3C6</div>
</div>
<div style="flex:1">
 <div style="height:64px;border-radius:12px 12px 0 0;background:linear-gradient(to bottom,#F8FBF6,#E9F4E7);box-shadow:inset 0 0 0 .5px rgb(0 0 0 / .06)"></div>
 <div style="display:flex;height:28px">
  <div style="flex:1;background:#3E9E6B"></div><div style="flex:1;background:#8AA83E"></div>
 </div>
 <div style="height:22px;background:#FFFFFF;border-radius:0 0 12px 12px;box-shadow:inset 0 0 0 .5px rgb(0 0 0 / .06)"></div>
 <div style="font-size:12px;font-weight:600;margin-top:8px">Meadow</div>
 <div class="mono" style="font-size:9px;line-height:1.5">#F8FBF6 → #E9F4E7<br>#3E9E6B · #8AA83E</div>
</div>
</div></body></html>
