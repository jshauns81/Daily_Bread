<!-- @dsCard group="Brand" viewport="700x240" name="App icon" subtitle="The mark is the year heatmap — one gold day in a grid. Not a loaf." -->
<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><title>App icon</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div style="display:flex;align-items:center;gap:24px">
<img src="../assets/app-icon-512.png" alt="Daily Bread app icon" style="width:120px;height:120px;border-radius:27px;box-shadow:var(--ds-card-shadow)">
<img src="../assets/app-icon-128.png" alt="" style="width:64px;height:64px;border-radius:15px;box-shadow:var(--ds-card-shadow)">
<div style="flex:1;font-size:12px;color:var(--ds-label-2);line-height:1.7">
The year grid is called <i>“the app’s emotional high point”</i> in its own source, and gold is money — so the icon is <b style="color:var(--ds-label)">one good day</b>.<br>
<span style="color:var(--ds-label-3)">There is no wordmark and no vector logo. Use this icon, or the login lockup. Never draw one.</span>
</div></div></body></html>
