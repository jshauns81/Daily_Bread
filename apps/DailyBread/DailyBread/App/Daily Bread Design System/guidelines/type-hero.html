<!-- @dsCard group="Type" viewport="700x200" name="The rounded hero" subtitle="The one place a different face appears: SF Pro Rounded, 42pt, for the balance." -->
<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><title>Hero</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div class="card" style="padding:var(--ds-card-padding-roomy)">
<div class="sec" style="letter-spacing:var(--ds-kerning-eyebrow)">Balance</div>
<div style="font-family:var(--ds-font-rounded);font-size:var(--ds-text-hero);font-weight:700;color:var(--ds-gold);line-height:1.05;margin-top:2px">$48.75</div>
</div>
<div class="mono" style="margin-top:12px;line-height:1.7">.system(size: 42, weight: .bold, design: .rounded)<br>+ .contentTransition(.numericText()) — the number animates when it changes</div>
</body></html>
