<!-- @dsCard group="Spacing" viewport="700x180" name="Stack spacing" subtitle="Not a strict 4pt grid — 14 and 18 are as common as 12 and 16." -->
<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div style="display:flex;align-items:flex-end;gap:10px">
<div style="text-align:center"><div style="width:2px;height:2px;background:var(--ds-accent);border-radius:3px;margin:0 auto"></div><div class="mono" style="font-size:9px;margin-top:6px">2</div></div><div style="text-align:center"><div style="width:4px;height:4px;background:var(--ds-accent);border-radius:3px;margin:0 auto"></div><div class="mono" style="font-size:9px;margin-top:6px">4</div></div><div style="text-align:center"><div style="width:6px;height:6px;background:var(--ds-accent);border-radius:3px;margin:0 auto"></div><div class="mono" style="font-size:9px;margin-top:6px">6</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--ds-accent);border-radius:3px;margin:0 auto"></div><div class="mono" style="font-size:9px;margin-top:6px">8</div></div><div style="text-align:center"><div style="width:10px;height:10px;background:var(--ds-accent);border-radius:3px;margin:0 auto"></div><div class="mono" style="font-size:9px;margin-top:6px">10</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--ds-accent);border-radius:3px;margin:0 auto"></div><div class="mono" style="font-size:9px;margin-top:6px">12</div></div><div style="text-align:center"><div style="width:14px;height:14px;background:var(--ds-accent);border-radius:3px;margin:0 auto"></div><div class="mono" style="font-size:9px;margin-top:6px">14</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--ds-accent);border-radius:3px;margin:0 auto"></div><div class="mono" style="font-size:9px;margin-top:6px">16</div></div><div style="text-align:center"><div style="width:18px;height:18px;background:var(--ds-accent);border-radius:3px;margin:0 auto"></div><div class="mono" style="font-size:9px;margin-top:6px">18</div></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--ds-accent);border-radius:3px;margin:0 auto"></div><div class="mono" style="font-size:9px;margin-top:6px">20</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--ds-accent);border-radius:3px;margin:0 auto"></div><div class="mono" style="font-size:9px;margin-top:6px">24</div></div>
</div>
<div class="sec" style="margin-top:16px;letter-spacing:0">Default VStack gap is 14. Screens pad 16. Chips pad 9×5. Pool tiles pad 10.</div>
</body></html>
