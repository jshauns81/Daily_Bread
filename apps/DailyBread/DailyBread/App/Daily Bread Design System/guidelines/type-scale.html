<!-- @dsCard group="Type" viewport="700x360" name="Apple text styles" subtitle="SF Pro at the system scale. Dynamic Type is respected — treat these as baseline." -->
<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><title>Type</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div style="display:flex;flex-direction:column;gap:5px">

<div style="display:flex;align-items:baseline;gap:14px"><span class="mono" style="width:150px;flex:0 0 auto">largeTitle · 34px</span><span style="font-size:34px;font-weight:700;line-height:1.2">Home</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="mono" style="width:150px;flex:0 0 auto">title · 28px</span><span style="font-size:28px;font-weight:800;line-height:1.2">LVL 4</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="mono" style="width:150px;flex:0 0 auto">title2 · 22px</span><span style="font-size:22px;font-weight:700;line-height:1.2">Good evening, Ada</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="mono" style="width:150px;flex:0 0 auto">title3 · 20px</span><span style="font-size:20px;font-weight:700;line-height:1.2">2h 30m</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="mono" style="width:150px;flex:0 0 auto">headline · 17px</span><span style="font-size:17px;font-weight:600;line-height:1.2">New Task</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="mono" style="width:150px;flex:0 0 auto">body · 17px</span><span style="font-size:17px;font-weight:500;line-height:1.2">Take out the trash</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="mono" style="width:150px;flex:0 0 auto">subheadline · 15px</span><span style="font-size:15px;font-weight:600;line-height:1.2">4 of 7 this week</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="mono" style="width:150px;flex:0 0 auto">footnote · 13px</span><span style="font-size:13px;font-weight:400;line-height:1.2">Couldn’t reach the server.</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="mono" style="width:150px;flex:0 0 auto">caption · 12px</span><span style="font-size:12px;font-weight:400;line-height:1.2">Ada · 12m ago</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="mono" style="width:150px;flex:0 0 auto">caption2 · 11px</span><span style="font-size:11px;font-weight:400;line-height:1.2">in your pool</span></div>
</div></body></html>
