<!-- @dsCard group="Type" viewport="700x160" name="Monospaced digits" subtitle=".monospacedDigit() on anything that ticks — never a mono font for text." -->
<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><title>Mono digits</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--ds-font);background:var(--ds-background);color:var(--ds-label);padding:16px;box-sizing:border-box;min-height:100vh;-webkit-font-smoothing:antialiased}
.sec{font-size:var(--ds-text-caption);font-weight:700;letter-spacing:var(--ds-kerning-section);text-transform:uppercase;color:var(--ds-label-2)}
.card{background:var(--ds-card);border-radius:var(--ds-radius-card);box-shadow:var(--ds-card-shadow),0 0 0 .5px var(--ds-card-stroke);padding:var(--ds-card-padding)}
.mono{font-family:var(--ds-font-mono);font-size:10px;color:var(--ds-label-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:var(--ds-accent);text-decoration:none}a:hover{opacity:.8}
</style></head><body><div class="row" style="gap:26px;font-variant-numeric:tabular-nums">
<span style="font-size:15px;font-weight:700;color:var(--ds-accent);font-family:var(--ds-font-mono)">5 / 7 XP</span>
<span style="font-size:15px;font-weight:600;font-family:var(--ds-font-mono)">up to 3× a week</span>
<span style="font-size:15px;font-weight:600;color:var(--ds-label-2);font-family:var(--ds-font-mono)">3/5</span>
<span style="font-size:15px;font-weight:700;color:var(--ds-help);font-family:var(--ds-font-mono)">−25 min</span>
</div>
<div class="mono" style="margin-top:16px">SwiftUI keeps SF Pro and only swaps to tabular figures. Do not switch to SF Mono for these.</div>
</body></html>
