<!DOCTYPE html>
<html data-theme="sunroom"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0}body{width:1280px;height:854px;display:flex;font-family:var(--ds-font);overflow:hidden}
.main{flex:1;background:var(--db-accent);display:grid;place-items:center}
.mark{display:flex;align-items:center;gap:40px}
.mark img{width:210px;height:210px;border-radius:48px;box-shadow:0 14px 50px rgb(0 0 0 / .3)}
.name{font-size:110px;font-weight:700;letter-spacing:-.035em;line-height:.92;color:#fff}
.sub{font-size:36px;font-weight:400;font-style:italic;color:#ffffffc4;margin-top:14px}
.strip{width:320px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head>
<body>
<div class="main"><div class="mark"><img src="assets/app-icon-512.png" alt=""><div><div class="name">Daily<br>Bread</div><div class="sub">give us this day</div></div></div></div>
<div class="strip"><div style="background:#E0A21E"></div><div style="background:#C98A1E"></div><div style="background:#2E8C86"></div><div style="background:#D1363B"></div></div>
</body></html>
